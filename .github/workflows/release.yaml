name: Version Bump and Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  run-tests:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync
          uv add toml

      - name: Run tests
        run: |
          uv run pytest

  update-version:
    needs: run-tests
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Extract version bump type from PR title
        id: extract_type
        run: |
          echo "PR Title: ${{ github.event.pull_request.title }}"
          TITLE="${{ github.event.pull_request.title }}"
          echo $TITLE
          TYPE="patch"
          if [[ "$TITLE" == major:* ]]; then
            TYPE="major"
          elif [[ "$TITLE" == minor:* ]]; then
            TYPE="minor"
          fi
          echo "TYPE IS = $TYPE"
          echo "bump_type=$TYPE" >> $GITHUB_OUTPUT


      - name: Bump version
        id: bump_version
        run: |
          uv run python .github/scripts/bump_version.py ${{ steps.extract_type.outputs.bump_type }}

      - name: Set up Git credentials
        run: |
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf https://github.com/

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/flappy_raqui/__version__.py
          git commit -m "Bump version: ${{ steps.extract_type.outputs.bump_type }}" || echo "No changes to commit"
          git push origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepend to CHANGELOG.md
        run: |
          VERSION="${{ steps.bump_version.outputs.new_version }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_NUMBER=${{ github.event.pull_request.number }}
          DATE=$(date +'%Y-%m-%d')
      
          TEMP_FILE=$(mktemp)
      
          {
            echo "## #$PR_NUMBER - v$VERSION - $PR_TITLE - ($DATE)"
            echo ""
            echo "$PR_BODY"
            echo ""
            cat CHANGELOG.md
          } > "$TEMP_FILE"
      
          mv "$TEMP_FILE" CHANGELOG.md

      - name: Commit and push changelog update
        run: |
          git add CHANGELOG.md
          git commit -m "docs: update changelog for PR #${{ github.event.pull_request.number }}"
          git pull --rebase origin main
          git push origin main

  release-tag:
    needs: update-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Create git tag
        run: |
          git tag v${{ needs.update-version.outputs.new_version }}
          git push origin v${{ needs.update-version.outputs.new_version }}

  publish-binary:
    needs: [update-version, release-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.update-version.outputs.new_version }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v3
        with:
          ref: v${{ needs.update-version.outputs.new_version }}

      - name: Set up UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build the standalone binary
        run: |
          make exe NUITKA_FLAGS=--assume-yes-for-downloads

      # Release assets are stored as plain blobs: GitHub keeps no POSIX mode, so
      # a bare binary downloads as 644 and needs a chmod before it will run.
      # tar records the mode, so ship the executable inside a tarball.
      - name: Package the binary for release
        id: artifact
        run: |
          ASSET="flappy-raqui-v${VERSION}-linux-x86_64.tar.gz"
          chmod +x build/flappy-raqui
          tar -czvf "build/${ASSET}" -C build flappy-raqui
          echo "path=build/${ASSET}" >> $GITHUB_OUTPUT

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          {
            printf '%s\n\n' "$PR_BODY"
            echo '## Install (Linux x86_64)'
            echo '```'
            echo "tar -xzf flappy-raqui-v${VERSION}-linux-x86_64.tar.gz"
            echo './flappy-raqui'
            echo '```'
          } > release-notes.md
          gh release create "v${VERSION}" "${{ steps.artifact.outputs.path }}" \
            --title "v${VERSION} — ${PR_TITLE}" \
            --notes-file release-notes.md
